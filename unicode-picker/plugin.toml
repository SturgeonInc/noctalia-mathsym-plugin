id = "fisherman/unicode-picker"
name = "Unicode Picker"
version = "0.1.0"
# 24 for argv-style noctalia.runAsync.
plugin_api = 24
author = "fisherman"
license = "MIT"
dependencies = ["wtype"]
tags = ["unicode", "latex", "lean", "launcher"]
icon = "math-symbols"
description = "Find unicode characters by LaTeX or Lean 4 input-method name from the launcher and copy them to the clipboard."

[[setting]]
key = "notify_on_copy"
type = "bool"
label_key = "settings.notify_on_copy.label"
description_key = "settings.notify_on_copy.description"
default = true

[[setting]]
key = "paste_after_copy"
type = "bool"
label_key = "settings.paste_after_copy.label"
description_key = "settings.paste_after_copy.description"
default = false

[[setting]]
key = "paste_delay_ms"
type = "int"
label_key = "settings.paste_delay_ms.label"
description_key = "settings.paste_delay_ms.description"
default = 150
min = 0
max = 2000

[[launcher_provider]]
id = "unicode"
entry = "unicode.luau"
prefix = "uni"
glyph = "math-symbols"
include_in_global_search = false
debounce_ms = 60
